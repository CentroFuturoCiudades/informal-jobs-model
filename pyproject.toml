[project]
name = "informal-jobs-model"
version = "0.1.0"
description = "Formal/informal employment estimates for the Guadalajara OD survey, trained on ENOE"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eodgdl[giro]",
    "mxcensus",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "numpy>=2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
mxcensus = { git = "https://github.com/CentroFuturoCiudades/mxcensus.git", rev = "v0.2.0" }
eodgdl = { git = "https://github.com/CentroFuturoCiudades/eodgdl.git", branch = "giro-model" }

[project.scripts]
compare-outputs = "informal_jobs_model.compare_outputs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/informal_jobs_model"]
