# Feature lists of the informality stages (3 and 5); the OD giro model has its own config in od_sector/config.yaml. Loaded via src.load_config("models"). The "robust" (without
# education) specifications are derived in code by dropping `escolaridad` from the corresponding list.

# Harmonized attributes shared by both surveys (stage 2 output); every feature list below is a subset of these.
# 
harmonized_features: [genero, ocupacion, edad_num, edad_cat, escolaridad, municipio, estado_civil, parentesco, tamano_viv_cat, sector, lugar_trabajo]
# Numeric model features (everything else is categorical).
numeric_features: [edad_num]

informality:                 # stage 5: ENOE-trained informality model
  features: [genero, ocupacion, edad_num, escolaridad, municipio, estado_civil, parentesco, tamano_viv_cat, sector, lugar_trabajo]
  # Masked evaluation of the without-education model on the OD non-respondent profile (review item 2.4).
  od_profile: [genero, ocupacion, edad_num, municipio, estado_civil, parentesco, tamano_viv_cat]
  gap_decomposition: [genero, ocupacion, edad_num, escolaridad, municipio, estado_civil, parentesco, tamano_viv_cat, sector]
  # Two components of informality (follow-up diagnostic): informal-sector units vs unprotected employment elsewhere.
  components: [informal_sector, informal_unprotected]
